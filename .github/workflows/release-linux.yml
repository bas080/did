name: Release Linux Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-linux:
    name: Build & Upload Linux Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package Binary
        run: |
          tar -czvf did-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release did
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: did-linux-x86_64
          path: did-linux-x86_64.tar.gz
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: did-linux-x86_64.tar.gz
