name: Release Linux Binary

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-linux:
    name: Build & Upload Linux Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Prepare Binary Asset
        run: |
          cp target/x86_64-unknown-linux-gnu/release/did did-linux-x86_64
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: did-linux-x86_64
          path: did-linux-x86_64
      - name: Publish Latest Release Asset
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Development Build"
          body: "Automated latest release built from latest commit on main branch."
          prerelease: true
          files: did-linux-x86_64
      - name: Publish Version Tag Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: did-linux-x86_64
