name: Release Windows Binary

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    name: Build & Upload Windows Binary
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare Binary Asset
        shell: powershell
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/did.exe did-windows-x86_64.exe
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: did-windows-x86_64.exe
          path: did-windows-x86_64.exe
      - name: Publish Development Build Asset
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: development
          name: "Development Build"
          body: "Automated development build from latest commit on main branch."
          prerelease: true
          files: did-windows-x86_64.exe
      - name: Publish Version Tag Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: did-windows-x86_64.exe
      - name: Publish Latest Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Version Release"
          body: "Latest version tag release build."
          files: did-windows-x86_64.exe
