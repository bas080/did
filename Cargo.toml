[package]
name = "did"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "html"] }
termimad = "0.35.5"
unicode-width = "0.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.17"
